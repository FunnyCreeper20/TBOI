<!DOCTYPE html>
<html>
<head>
    <link rel="icon" type="image/webp" href="IMG_0251.webp">
    <link rel="stylesheet" type="text/css" href="https://tboi.com/assets/main.css">
    <link href='https://fonts.googleapis.com/css?family=Open+Sans:300,400' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css">
    <style>
        /* This centers the game and the controls */
        #gameParent {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
        }

        #ruffle-container {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        /* Mobile Controls Styling */
        .mobile-controls {
            display: none; 
            grid-template-columns: repeat(3, 60px);
            gap: 10px;
            margin-top: 20px;
        }

        @media (pointer: coarse) {
            .mobile-controls { display: grid; }
        }

        .ctrl-btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #fff;
            color: white;
            border-radius: 10px;
            font-weight: bold;
            user-select: none;
            touch-action: manipulation;
        }
    </style>
</head>

<body>
    <div id="gameParent">
        <div id="ruffle-container"></div> 
        
        <div class="mobile-controls">
            <div></div><button class="ctrl-btn" id="btn-w">W</button><div></div>
            <button class="ctrl-btn" id="btn-a">A</button>
            <button class="ctrl-btn" id="btn-s">S</button>
            <button class="ctrl-btn" id="btn-d">D</button>
        </div>
        
        <p>Centered with Flexbox! 😭🙏</p>
    </div>

    <div class="search" style="display:flex; justify-content:center; align-items:center; flex-direction:column;">
        <form action="#">
            <input class="search-input" type="text" autocomplete="off" placeholder="Search anything!" autofocus>
        </form>
        </div>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script>
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("ruffle-container");
        container.appendChild(player);
        player.load("https://trapjawws.github.io/josh/The%20Binding%20of%20Isaac.swf");
        player.style.width = "1000px";
        player.style.height = "572px";

        function simulateKey(keyCode, keyChar, type) {
            const event = new KeyboardEvent(type, {
                key: keyChar,
                code: `Key${keyChar.toUpperCase()}`,
                keyCode: keyCode,
                which: keyCode,
                bubbles: true
            });
            window.dispatchEvent(event);
        }

        const buttonMap = {
            'btn-w': { code: 87, char: 'w' },
            'btn-a': { code: 65, char: 'a' },
            'btn-s': { code: 83, char: 's' },
            'btn-d': { code: 68, char: 'd' }
        };

        Object.keys(buttonMap).forEach(id => {
            const btn = document.getElementById(id);
            const data = buttonMap[id];
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                simulateKey(data.code, data.char, 'keydown');
            });
            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                simulateKey(data.code, data.char, 'keyup');
            });
        });
    </script>

    <div class="main">
        </div>
</body>
</html>
